name: Build and deploy Node.js app to Azure Web App - ux-studio

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      NODE_ENV: production
      NPM_CONFIG_PRODUCTION: false
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build --workspace @uxm/web

      - name: Build API app
        run: npm run build --workspace @uxm/api

      - name: Run API database migrations
        if: github.event_name == 'push'
        run: npm run db:migrate:prod --workspace @uxm/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Create web deployment package
        run: |
          mkdir -p web-deploy
          cp -a apps/web/.next/standalone/. web-deploy/

          if [ -d "web-deploy/apps/web" ]; then
            mkdir -p web-deploy/apps/web/.next
            cp -a apps/web/.next/static web-deploy/apps/web/.next/static

            if [ -d "apps/web/public" ]; then
              cp -a apps/web/public web-deploy/apps/web/public
            fi

            cd web-deploy
            npm pkg set scripts.start="node apps/web/server.js"
            cd ..
          else
            mkdir -p web-deploy/.next
            cp -a apps/web/.next/static web-deploy/.next/static

            if [ -d "apps/web/public" ]; then
              cp -a apps/web/public web-deploy/public
            fi

            cd web-deploy
            npm pkg set scripts.start="node server.js"
            cd ..
          fi

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            .
            !node_modules
            !web-deploy
            !apps/web/.next

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: web-deploy
          include-hidden-files: true

  deploy-api:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy API app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: .

  deploy-web:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app

      - name: Deploy web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEB_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          package: .